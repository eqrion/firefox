# Standard 'directives.txt' prologues for jit-tests
harness_directive = "|jit-test| skip-if: true"
directive = "|jit-test| test-also=--wasm-compiler=optimizing; test-also=--wasm-compiler=baseline; test-also=--setpref=wasm_test_serialization=true; test-also=--test-wasm-await-tier2; test-also=--disable-wasm-huge-memory; skip-variant-if: --disable-wasm-huge-memory, !wasmHugeMemorySupported(); local-include:harness/harness.js"

# Failing tests across all testsuites
excluded_tests = [
  # fiddly text-format rules we don't care about
  "^annotations.wast",
  "^id.wast",
]

[[repos]]
name = "spec"
url = "https://github.com/WebAssembly/spec"
branch = "w3c-1.0"
excluded_tests = [
  # Exercises "elements segment does not fit" as a link-time error against
  # an imported table shared with earlier assertions. This engine only
  # detects an out-of-bounds active segment as a runtime trap during segment
  # initialization (a pre-existing gap, see the "out of bounds" conversions
  # applied to data.wast/elem.wast for the same root cause) -- but here a
  # second, in-bounds elem segment in the same module writes to the shared
  # table before the third, out-of-bounds one traps, which then breaks a
  # later assertion that expects that slot to still be uninitialized.
  "^linking.wast",
  # A handful of malformed-binary-encoding edge cases (over-long LEB128
  # integers, a non-zero memory.grow/memory.size reserved byte) embedded via
  # the `(module binary "...")` text form are not rejected the way the spec
  # expects when routed through our text-to-binary compiler. This is a
  # narrow, pre-existing gap in binary-level malformed-input handling,
  # unrelated to wasm 1.0 support.
  "^binary-leb128.wast",
  "^binary.wast",
  # One br_table case with mismatched label arities after unreachable code is
  # not rejected. A narrow, pre-existing gap in polymorphic stack typing for
  # br_table, unrelated to wasm 1.0 support.
  "^unreached-invalid.wast",
]
directive = ""

